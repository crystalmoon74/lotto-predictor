name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 매주 일요일 12:00 KST (토요일 추첨 결과 반영 후 재배포)
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Download latest draw results
        run: |
          mkdir -p public/data
          curl -fsSL --retry 3 -o public/data/all.json https://smok95.github.io/lotto/results/all.json
          node -e "const d=require('./public/data/all.json'); console.log('draws:', d.length, 'latest:', d[d.length-1].draw_no)"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v5
